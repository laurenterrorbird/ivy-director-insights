name: Kitchen Report Automation

on:
  schedule:
    # Run daily at 2 AM UTC (adjust cron expression as needed)
    # Format: minute hour day month weekday
    # This runs at 2 AM UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual trigger from GitHub UI

jobs:
  download-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps
      
      - name: Create Google credentials file
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          echo "$GOOGLE_CREDENTIALS" > credentials.json
      
      - name: Run kitchen report script
        env:
          HEADLESS: "true"
          USE_BROWSER_PASTE: "false"
          SEMINARDESK_USERNAME: ${{ secrets.SEMINARDESK_USERNAME }}
          SEMINARDESK_PASSWORD: ${{ secrets.SEMINARDESK_PASSWORD }}
        run: python3 kitchen.py
        continue-on-error: false
      
      - name: Upload reports as artifact (optional)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kitchen-reports
          path: downloads/
          retention-days: 7






